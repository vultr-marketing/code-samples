---
- name: Add rancher-prime repo
  command: helm repo add rancher-prime https://charts.rancher.com/server-charts/prime
  register: repo_add
  failed_when: repo_add.rc != 0 and 'already exists' not in repo_add.stderr
  changed_when: "'has been added' in repo_add.stdout"

- name: Update helm repos
  command: helm repo update
  changed_when: false

- name: Create cattle-system namespace
  command: kubectl create namespace cattle-system
  register: ns_create
  failed_when: ns_create.rc != 0 and 'AlreadyExists' not in ns_create.stderr
  changed_when: ns_create.rc == 0
  environment:
    KUBECONFIG: /etc/rancher/rke2/rke2.yaml

- name: Create pull secret in cattle-system
  shell: |
    kubectl create secret docker-registry application-collection \
      --docker-server=dp.apps.rancher.io \
      --docker-username={{ appco_username }} \
      --docker-password={{ appco_user_token }} \
      -n cattle-system \
      --dry-run=client -o yaml | kubectl apply -f -
  environment:
    KUBECONFIG: /etc/rancher/rke2/rke2.yaml
  no_log: true

- name: Patch cattle-system default service account
  command: >
    kubectl patch serviceaccount default -n cattle-system
    -p '{"imagePullSecrets":[{"name":"application-collection"}]}'
  environment:
    KUBECONFIG: /etc/rancher/rke2/rke2.yaml
  register: sa_patch
  changed_when: "'patched' in sa_patch.stdout"

- name: Wait for the RKE2 ingress-nginx controller to be ready
  command: >
    kubectl wait --for=condition=ready pod
    -l app.kubernetes.io/component=controller
    -n kube-system --timeout=300s
  environment:
    KUBECONFIG: /etc/rancher/rke2/rke2.yaml
  changed_when: false

- name: Check existing Rancher release status
  command: helm status rancher -n cattle-system -o json
  register: rancher_status
  failed_when: false
  changed_when: false
  environment:
    KUBECONFIG: /etc/rancher/rke2/rke2.yaml

# Adopts cattle-scc-system instead of uninstalling: a failed install can leave it Helm-unowned, conflicting on retry.
- name: Adopt the cattle-scc-system namespace into the Helm release
  shell: |
    kubectl annotate namespace cattle-scc-system \
      meta.helm.sh/release-name=rancher \
      meta.helm.sh/release-namespace=cattle-system \
      --overwrite
    kubectl label namespace cattle-scc-system \
      app.kubernetes.io/managed-by=Helm \
      --overwrite
  environment:
    KUBECONFIG: /etc/rancher/rke2/rke2.yaml
  when: >
    rancher_status.rc != 0
    or (rancher_status.stdout | from_json).info.status != "deployed"
  failed_when: false
  changed_when: false

- name: Install Rancher Prime
  shell: |
    helm upgrade --install rancher rancher-prime/rancher-prime \
      --namespace cattle-system \
      --set hostname={{ rancher_hostname }} \
      --set bootstrapPassword=admin \
      --set ingress.tls.source=letsEncrypt \
      --set letsEncrypt.email={{ le_email | default(appco_username) }} \
      --set letsEncrypt.ingress.class=nginx \
      {% if scc_reg_code | default('') != '' %}
      --set registration.enabled=true \
      --set registration.regCode={{ scc_reg_code }} \
      {% endif %}
      --wait --timeout 10m
  environment:
    KUBECONFIG: /etc/rancher/rke2/rke2.yaml
  when: >
    rancher_status.rc != 0
    or (rancher_status.stdout | from_json).info.status != "deployed"

- name: Wait for Rancher rollout
  command: kubectl -n cattle-system rollout status deploy/rancher-rancher-prime --timeout=600s
  environment:
    KUBECONFIG: /etc/rancher/rke2/rke2.yaml
  changed_when: false
